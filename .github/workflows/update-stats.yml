name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}  

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Fetch stats and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: boradesanket13
        run: |
          set -e

          # --- Profile-level stats ---
          PROFILE_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/users/$GH_USER")
          FOLLOWERS=$(echo "$PROFILE_JSON" | jq '.followers')
          FOLLOWING=$(echo "$PROFILE_JSON" | jq '.following')
          PUBLIC_REPOS=$(echo "$PROFILE_JSON" | jq '.public_repos')

          # --- Per-repo stars/forks (all repos, sorted by stars desc) ---
          REPOS_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/users/$GH_USER/repos?per_page=100&sort=updated")

          TOTAL_STARS=$(echo "$REPOS_JSON" | jq '[.[].stargazers_count] | add')
          TOTAL_FORKS=$(echo "$REPOS_JSON" | jq '[.[].forks_count] | add')

          TABLE_ROWS=$(echo "$REPOS_JSON" | jq -r '
            sort_by(-.stargazers_count) |
            .[] |
            select(.stargazers_count > 0 or .forks_count > 0) |
            "| [\(.name)](\(.html_url)) | \(.language // "-") | \(.stargazers_count) | \(.forks_count) |"
          ')

          # --- Compose stats block ---
          {
            echo "<!-- STATS:START -->"
            echo "### 📊 GitHub Stats (auto-updated)"
            echo ""
            echo "- 👥 Followers: **$FOLLOWERS** &nbsp;|&nbsp; Following: **$FOLLOWING**"
            echo "- 📦 Public repos: **$PUBLIC_REPOS**"
            echo "- ⭐ Total stars across repos: **$TOTAL_STARS** &nbsp;|&nbsp; 🍴 Total forks: **$TOTAL_FORKS**"
            echo ""
            echo "| Repo | Language | ⭐ Stars | 🍴 Forks |"
            echo "|---|---|---|---|"
            echo "$TABLE_ROWS"
            echo "<!-- STATS:END -->"
          } > stats_block.md

          # --- Inject into README between markers (create markers if missing) ---
          if ! grep -q "<!-- STATS:START -->" README.md; then
            printf "\n<!-- STATS:START -->\n<!-- STATS:END -->\n" >> README.md
          fi

          awk '
            /<!-- STATS:START -->/ { skip=1; while ((getline line < "stats_block.md") > 0) print line; close("stats_block.md") }
            /<!-- STATS:END -->/ { skip=0; next }
            !skip { print }
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update GitHub stats [skip ci]"
          git push

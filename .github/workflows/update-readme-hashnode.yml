
name: Update README with Hashnode Blogs

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-hashnode
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update README with Hashnode RSS
        id: update
        run: |
          for attempt in 1 2 3; do
            if python3 update_readme_hashnode.py; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed. Retrying in 15 seconds..."
              sleep 15
            fi
          done

          echo "RSS update failed after 3 attempts."
          exit 1

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README.md is already up to date."
            exit 0
          fi

          git commit -m "chore: update README with latest Hashnode blogs"

          git pull --rebase origin main
          git push origin HEAD:main
